<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Экзема-трекер{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg glass-nav sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('web.dashboard') }}">Экзема-трекер</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{{ url_for('web.new_entry') }}">Новая запись</a>
        <a class="nav-link" href="{{ url_for('web.history') }}">История</a>
        <a class="nav-link" href="{{ url_for('web.analytics') }}">Аналитика</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
